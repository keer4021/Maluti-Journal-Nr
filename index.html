<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JR Numbers</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6f4a"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#6b7280;--ln:#e3e6eb;--ac:#1f6f4a;--acl:#e6f3ec}
body{margin:0;font:15px system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:960px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:4px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:#fff}
label.grow{flex:1;min-width:200px}
button{cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.next{font-size:28px;font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}
.ok{background:var(--acl);border:1px solid var(--ac);border-radius:8px;padding:10px;margin-top:12px;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:12px}
td.jr{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.x{border:0;background:none;color:#b42318;padding:2px 6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.wrap{overflow-x:auto}
h1 small{font-size:12px;font-weight:400;color:var(--mut);margin-left:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .mut{font-size:12px;color:var(--mut);margin-left:auto}
</style></head><body><main>
<h1>JR References<small>v26.3</small></h1>
<div class="card">
 <div class="row" style="margin-bottom:10px">
  <label>Export<select id="xs"><option value="all">All books</option><option value="cur">Current book</option><option value="q">Search results</option></select></label>
  <label>From<input type="date" id="xf"></label>
  <label>To<input type="date" id="xt"></label>
  <button id="ex">Export to Excel (CSV)</button>
 </div>
 <div class="bar">
  <button class="pri" id="bu">Create backup</button>
  <button id="rs">Restore from backup</button>
  <input type="file" id="rf" accept=".json,application/json" hidden>
  <span class="mut" id="lb"></span>
 </div>
</div>
<div class="card">
 <div class="row">
  <label>Book<select id="bk"></select></label>
  <label>Prefix<input id="pf" size="8"></label>
  <div style="margin-left:8px"><div style="font-size:12px;color:var(--mut)">Next number</div><div class="next" id="nx"></div></div>
 </div>
 <div class="row" style="margin-top:12px">
  <label>Date<input type="date" id="dt"></label>
  <label class="grow">Description<input id="om" placeholder="e.g. move nkosana diesel to suppliers"></label>
  <button class="pri" id="go">Assign JR no.</button>
 </div>
 <div class="ok" id="ok"></div>
</div>
<div class="card">
 <div class="row" style="margin-bottom:10px">
  <label class="grow">Search<input id="q" placeholder="number or description"></label>
  <div class="tools"><button id="nb">+ New book</button></div>
 </div>
 <div class="wrap"><table><thead><tr><th>JR No.</th><th>Date</th><th>Book</th><th>Description</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</main>
<script>
const SEED=[{"d": "2025-11-19", "bk": "MVK25", "jr": "2025N-01", "o": ""}, {"d": "2025-11-19", "bk": "MVK26", "jr": "2025N-02", "o": ""}, {"d": "2025-11-20", "bk": "MVK26", "jr": "2026N-03", "o": ""}, {"d": "2025-11-20", "bk": "MVK26", "jr": "2026N-04", "o": ""}, {"d": "2025-11-26", "bk": "MVK26", "jr": "2026N-05", "o": "Moet betaling skuif vanaf 8100 na CASH"}, {"d": "2025-11-26", "bk": "MVK26", "jr": "2026N-06", "o": "SKUIF VAN HANS LENING"}, {"d": "2025-12-04", "bk": "MVK26", "jr": "2026N-07", "o": "verskuif versekering van 2500 rek"}, {"d": "2025-12-05", "bk": "MVK26", "jr": "2026N-08", "o": "SSK Rente Oct 2025"}, {"d": "2025-12-05", "bk": "MVK26", "jr": "2026N-09", "o": "SSK Rente Nov 2025"}, {"d": "2025-12-05", "bk": "MVK26", "jr": "2026N-10", "o": "afskryf van gelde mpa001"}, {"d": "2025-12-05", "bk": "MVK26", "jr": "2026N-11", "o": "skryf stukken grinder na incomste"}, {"d": "2026-01-05", "bk": "MVK26", "jr": "2026N-12", "o": "skuif pastel acc van 003 na 004"}, {"d": "2026-01-05", "bk": "MVK26", "jr": "2026N-13", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-01-14", "bk": "MVK26", "jr": "2026N-14", "o": "doen inventory JR"}, {"d": "2026-01-15", "bk": "MVK26", "jr": "2026N-15", "o": "skuif nico loan na loan account"}, {"d": "2026-02-03", "bk": "MVK26", "jr": "2026N-16", "o": "skuif bank koste en inbetaling na regte prifile"}, {"d": "2026-02-03", "bk": "MVK26", "jr": "2026N-17", "o": "skuif diesel van nkosana supplier no"}, {"d": "2026-02-06", "bk": "MVK26", "jr": "2026N-18", "o": "afskryf van R600 kontant van 2025"}, {"d": "2026-02-20", "bk": "MVK26", "jr": "2026N-19", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-02-23", "bk": "MVK26", "jr": "2026N-20", "o": "SKUIF VAN 8300007 NA COURIERKOSTE"}, {"d": "2026-02-24", "bk": "MVK26", "jr": "2026N-21", "o": "skuif sms031 na 9130 toe"}, {"d": "2026-02-24", "bk": "MVK26", "jr": "2026N-22", "o": "INV55350 IN VERKEERD AS CHEQUE AFGEPOS"}, {"d": "2026-02-27", "bk": "MVK26", "jr": "2026N-23", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-03-16", "bk": "MVK26", "jr": "2026N-24", "o": "skuif 'n betaling na 9150"}, {"d": "2026-03-16", "bk": "MVK26", "jr": "2026N-25", "o": "skuif betaling na agri01"}, {"d": "2026-03-17", "bk": "MVK26", "jr": "2026N-26", "o": "jr vir rente en boete"}, {"d": "2026-03-27", "bk": "MVK26", "jr": "2026N-27", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-03-30", "bk": "MVK26", "jr": "2026N-28", "o": "stel R229 betaling reg"}, {"d": "2026-04-13", "bk": "MVK26", "jr": "2026N-29", "o": "skuif R16800 van 9150 na 9130"}, {"d": "2026-04-20", "bk": "MVK26", "jr": "2026N-30", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-05-04", "bk": "MVK26", "jr": "2026N-31", "o": "skuif in insentive bonus na 4400/014"}, {"d": "2026-05-04", "bk": "MVK26", "jr": "2026N-32", "o": "skuif in insentive bonus na regte maand"}, {"d": "2026-05-04", "bk": "MVK26", "jr": "2026N-33", "o": "skuif in insentive bonus na regte maand"}, {"d": "2026-05-05", "bk": "MVK26", "jr": "2026N-34", "o": "PPECB VERKEERD AFGEPOS"}, {"d": "2026-05-19", "bk": "MVK26", "jr": "2026N-35", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-05-21", "bk": "MVK26", "jr": "2026N-36", "o": "SMS089 skuif kontant van 9110"}, {"d": "2026-05-21", "bk": "MVK26", "jr": "2026N-37", "o": "SMS089 skuif kontant van 9110"}, {"d": "2026-05-21", "bk": "MVK26", "jr": "2026N-38", "o": "SMS089 skuif kontant van 9110"}, {"d": "2026-05-21", "bk": "MVK26", "jr": "2026N-39", "o": "SMS089 skuif kontant van 9110"}, {"d": "2026-05-21", "bk": "MVK26", "jr": "2026N-40", "o": "SMS089 skuif kontant van 9110"}, {"d": "2026-05-25", "bk": "MVK26", "jr": "2026N-41", "o": "Skuif bedrae na regte rekenings"}, {"d": "2026-05-25", "bk": "MVK26", "jr": "2026N-42", "o": "Skuif bedrae na regte rekenings"}, {"d": "2026-05-28", "bk": "MVK26", "jr": "2026N-43", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-06-01", "bk": "MVK26", "jr": "2026N-44", "o": "PPECB VERKEERD AFGEPOS"}, {"d": "2026-06-01", "bk": "MVK26", "jr": "2026N-45", "o": "skuif betaling regte supplier"}, {"d": "2026-06-10", "bk": "MVK26", "jr": "2026N-46", "o": "skuif betaling regte supplier"}, {"d": "2026-06-11", "bk": "MVK26", "jr": "2026N-47", "o": "skuif 2 payment na rekenings"}, {"d": "2026-06-15", "bk": "MVK26", "jr": "2026N-48", "o": "Skuif betaling"}, {"d": "2026-06-17", "bk": "MVK26", "jr": "2026N-49", "o": "Skuif betaling"}, {"d": "2026-06-18", "bk": "MVK26", "jr": "2026N-50", "o": "Skuif betaling"}, {"d": "2026-07-09", "bk": "MVK26", "jr": "2026N-51", "o": "Skuif betaling"}, {"d": "2026-07-09", "bk": "MVK26", "jr": "2026N-52", "o": "skuif nkosana diesel na suppliers"}, {"d": "2026-06-29", "bk": "MVK26", "jr": "2026N-53", "o": "SKUIF VAN BETALING"}, {"d": "2026-07-16", "bk": "MVK26", "jr": "2026N-54", "o": "SKUIF VAN BETALING"}, {"d": "2026-07-17", "bk": "MVK26", "jr": "2026N-55", "o": "SKUIF VAN BETALING"}, {"d": "2026-07-17", "bk": "MVK26", "jr": "2026N-56", "o": "SKUIF VAN BETALING"}, {"d": "2026-07-17", "bk": "MVK26", "jr": "2026N-57", "o": "SKUIF VAN BETALING"}, {"d": "2026-07-17", "bk": "MVK26", "jr": "2026N-58", "o": "SKUIF VAN BETALING"}, {"d": "2026-09-21", "bk": "MVK26", "jr": "2026N-59", "o": "MAAK JR 2026N-04 REG"}, {"d": "2026-10-14", "bk": "MVK26", "jr": "2026N-60", "o": "Skuif MFT transport na 2000/006"}, {"d": "2026-10-14", "bk": "MVK26", "jr": "2026N-61", "o": "skuif transport cost na regte uitgawe accounts"}, {"d": "2026-10-20", "bk": "MVK26", "jr": "2026N-62", "o": "JR na 1000/003"}, {"d": "2026-10-20", "bk": "MVK26", "jr": "2026N-63", "o": "skuif MVK na advertensie koste"}, {"d": "2026-10-21", "bk": "MVK26", "jr": "2026N-64", "o": "move die study loan na bursary"}, {"d": "2026-10-21", "bk": "MVK26", "jr": "2026N-65", "o": "Skuif ETI uit 9002"}, {"d": "2026-09-22", "bk": "MVK26", "jr": "2026N-66", "o": "Salaris JR"}, {"d": "2026-09-22", "bk": "MVK26", "jr": "2026N-67", "o": "skuif R464.75 van sal001 na sal003"}];
const K='jr-app-v1';
let S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S={rows:SEED,books:{MVK25:'2025N-',MVK26:'2026N-'},cur:'MVK26'};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function nextNo(bk){const p=S.books[bk];let m=0;
 for(const r of S.rows){const mm=r.jr.match(/-(\d+)$/);if(mm&&(r.bk===bk||r.jr.startsWith(p)))m=Math.max(m,+mm[1])}
 return p+String(m+1).padStart(2,'0')}
function fmt(d){const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
function render(){
 $('bk').innerHTML=Object.keys(S.books).map(b=>`<option${b===S.cur?' selected':''}>${b}</option>`).join('');
 $('pf').value=S.books[S.cur];$('nx').textContent=nextNo(S.cur);
 const q=$('q').value.toLowerCase();
 $('tb').innerHTML=S.rows.map((r,i)=>[r,i]).filter(([r])=>!q||(r.jr+' '+r.o).toLowerCase().includes(q)).reverse()
  .map(([r,i])=>`<tr><td class="jr">${r.jr}</td><td>${fmt(r.d)}</td><td>${r.bk}</td><td>${r.o.replace(/</g,'&lt;')}</td><td><button class="x" data-i="${i}" title="Delete">✕</button></td></tr>`).join('');
}
$('dt').value=new Date().toISOString().slice(0,10);
$('bk').onchange=e=>{S.cur=e.target.value;save();render()};
$('pf').onchange=e=>{S.books[S.cur]=e.target.value;save();render()};
$('q').oninput=render;
$('go').onclick=()=>{const o=$('om').value.trim();if(!o){$('om').focus();return}
 const jr=nextNo(S.cur);S.rows.push({d:$('dt').value,bk:S.cur,jr,o});save();
 $('om').value='';$('ok').style.display='block';
 $('ok').innerHTML=`Assigned: <b>${jr}</b> — ${o.replace(/</g,'&lt;')} <button id="cp">Copy</button>`;
 $('cp').onclick=()=>navigator.clipboard.writeText(jr);render()};
$('om').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
$('tb').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;
 if(confirm('Delete '+S.rows[i].jr+'?')){S.rows.splice(i,1);save();render()}};
$('nb').onclick=()=>{const b=prompt('Book name (e.g. MVK27):');if(!b)return;
 const p=prompt('Prefix (e.g. 2027N-):','');S.books[b]=p||'';S.cur=b;save();render()};
function dl(data,type,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click()}
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
$('ex').onclick=()=>{const c=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const s=$('xs').value,q=$('q').value.toLowerCase(),f=$('xf').value,t=$('xt').value;
 const rows=S.rows.filter(r=>(s!=='cur'||r.bk===S.cur)&&(s!=='q'||!q||(r.jr+' '+r.o).toLowerCase().includes(q))&&(!f||r.d>=f)&&(!t||r.d<=t));
 if(!rows.length){alert('No entries to export.');return}
 const csv='﻿JR Date;Book;JR No.;Description\n'+rows.map(r=>[fmt(r.d),r.bk,r.jr,r.o].map(c).join(';')).join('\n');
 dl(csv,'text/csv','Journal References'+(s==='cur'?' '+S.cur:'')+' '+today()+'.csv')};
function showLb(){const b=S.lastBackup;$('lb').textContent=b?'Last backup: '+fmt(b.slice(0,10))+b.slice(10):'No backup made yet'}
$('bu').onclick=async()=>{const t=now(),name='JR Backup '+t.replace(':','h')+'.json';
 const json=JSON.stringify({app:'JR Numbers',version:'26.3',date:t,data:{...S,lastBackup:t}},null,1);
 if(window.showSaveFilePicker){
  try{const h=await showSaveFilePicker({suggestedName:name,id:'jr-backup',startIn:'documents',types:[{description:'JR Backup',accept:{'application/json':['.json']}}]});
   const w=await h.createWritable();await w.write(json);await w.close()}
  catch(e){if(e.name!=='AbortError')alert('Could not save the backup: '+e.message);return}
 }else dl(json,'application/json',name);
 S.lastBackup=t;save();showLb()};
$('rs').onclick=()=>$('rf').click();
$('rf').onchange=async e=>{const fl=e.target.files[0];e.target.value='';if(!fl)return;
 try{const j=JSON.parse(await fl.text()),d=j.data||j;
  if(!Array.isArray(d.rows)||!d.books)throw 0;
  if(!confirm('Replace all current data ('+S.rows.length+' entries) with the backup ('+d.rows.length+' entries)?'))return;
  S=d;if(!S.books[S.cur])S.cur=Object.keys(S.books)[0];save();render();showLb();alert('Backup restored.')}
 catch(err){alert('Could not read the backup file.')}};
render();showLb();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script></body></html>
